name: Lumenia CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = mínimo declarado em pyproject.toml; 3.14 = versão da máquina
        # de desenvolvimento (o .pyd local é cp314). Ver requirements-dev.lock.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Verify scientific runtime dependencies
        # scripts/build_portable.py empacota numpy e scipy; falhar aqui é mais
        # claro que o RuntimeError do teste de contrato do build portátil.
        run: python -c "import numpy, scipy; print(numpy.__version__, scipy.__version__)"
      - name: Build native engine (scalar)
        run: python scripts/build_native.py --simd scalar --force
      - name: Measure native engine baseline
        run: python benchmarks/run_engine_benchmarks.py --iterations 3 --canvas-size 256 --points 48 --output build/benchmarks/engine.json
      - name: Run executive test suite
        run: python tests/run_all_tests.py --coverage --coverage-minimum 80
      - name: Publish benchmark and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-benchmark-py${{ matrix.python-version }}
          path: |
            build/benchmarks/engine.json
            build/coverage/document.json

  windows-avx2:
    # Job separado em vez de entrar na matrix acima: o caminho AVX2 e um
    # perfil de build diferente (LUMENIA_SIMD=avx2), nao mais uma versao de
    # Python. Rodar so numa versao evita triplicar o tempo de CI.
    # Ver docs/historico/auditoria-f017-f031-endurecimento-navigator.md (F-020).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Verify scientific runtime dependencies
        # scripts/build_portable.py empacota numpy e scipy; falhar aqui é mais
        # claro que o RuntimeError do teste de contrato do build portátil.
        run: python -c "import numpy, scipy; print(numpy.__version__, scipy.__version__)"
      - name: Build native engine (AVX2)
        run: python scripts/build_native.py --simd avx2 --force
      - name: Verify AVX2 module loads
        run: python -c "import aladyn_engine_native; print('aladyn_engine_native (AVX2) carregado com sucesso:', aladyn_engine_native.__file__)"
      - name: Run executive test suite
        run: python tests/run_all_tests.py
