[build-system]
requires = ["setuptools>=69", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenia-art-studio"
version = "0.2.0"
description = "Lumenia Art Studio com Aladyn Engine nativo"
authors = [{name = "Aladyn Team"}]
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "numpy>=1.26",
  "Pillow>=10.0",
  "pybind11>=2.12",
]

# The native extension is declared by setup.py; avoid accidental inclusion of
# workspace directories (assets, logs, scratch) in wheel builds.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Linter (2026-09-25): regras do pyflakes e erros de sintaxe, zero achados.
# `tests/test_python_lint.py` falha em achado novo. Cache fora do repositório
# (política zero-dirt do AGENTS.md).
[tool.ruff]
target-version = "py311"
cache-dir = "~/.cache/ruff"

[tool.ruff.lint]
# C901: complexidade ciclomática (McCabe). Acima de 20 reprova; as funções que
# já passavam disso em 2026-09-25 estão marcadas com `# noqa: C901` e listadas
# em docs/01-correcao-da-base/01-pendencias-atuais.md (item 14).
select = ["E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 20
